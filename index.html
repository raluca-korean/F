<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korean by Hanja</title>
<meta name="description" content="Învață coreeana prin 214 rădăcini sino-coreene — studiu pas cu pas, apoi exerciții.">
<meta name="theme-color" content="#b3402c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23b3402c'/%3E%3Ctext x='32' y='46' font-family='Noto Sans KR, sans-serif' font-size='40' font-weight='900' fill='%23f2e9d8' text-anchor='middle'%3E學%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header class="kbh-header">
  <div class="kbh-titleWrap">
    <h1 class="kbh-title" id="pgTitle">Korean by Hanja</h1>
    <p class="kbh-sub" id="pgSub">Învață coreeana prin cele 214 hanja de bază</p>
  </div>
  <div class="kbh-controls">
    <button type="button" id="statsBtn" class="ctrlBtn" title="Statistici" aria-label="Statistici">📊</button>
    <button type="button" id="searchBtn" class="ctrlBtn" title="Caută (/)" aria-label="Caută">🔍</button>
    <button type="button" id="langBtn" class="ctrlBtn" aria-label="Schimbă limba"></button>
    <button type="button" id="darkBtn" class="ctrlBtn" title="Temă" aria-label="Schimbă tema">◐</button>
  </div>
</header>

<div class="kbh-badges">
  <div class="badge ok" id="bCorrect"><span class="dot"></span><span>Corecte: 0</span></div>
  <div class="badge" id="bTotal"><span class="dot"></span><span>Total: 0</span></div>
  <div class="badge" id="bStreak"><span class="dot"></span><span>Streak: 0</span></div>
  <div class="badge" id="bXP"><span class="dot"></span><span>⭐ 0 XP</span></div>
  <div class="badge" id="bMastered"><span class="dot"></span><span>Stăpânite: 0/0</span></div>
</div>

<div class="kbh-barWrap">
  <div class="kbh-barBg"><div class="kbh-barFill" id="barFill"></div></div>
</div>

<div class="kbh-tabs">
  <button type="button" class="tabBtn" id="tabLearn"></button>
  <button type="button" class="tabBtn" id="tabPractice"></button>
  <button type="button" class="tabBtn" id="tabPuzzle"></button>
</div>

<section id="learnView">
  <div class="learnNav">
    <button type="button" class="navBtn" id="learnPrev" aria-label="Hanja anterior">‹</button>
    <div class="learnPos" id="learnPos"></div>
    <button type="button" class="navBtn" id="learnNext" aria-label="Hanja următor">›</button>
  </div>
  <div class="kbh-card learnCard">
    <div class="promptWrap">
      <div id="learnRoot"></div>
      <div class="learnRootBtns">
        <button type="button" id="learnSpeak" title="Ascultă" aria-label="Ascultă citirea">▶</button>
        <button type="button" id="strokeBtn" title="Ordinea trăsăturilor" aria-label="Arată ordinea trăsăturilor">✍</button>
      </div>
    </div>
    <div id="learnMeaning"></div>
    <div class="learnSectionLabel" id="learnWordsLabel"></div>
    <div id="learnWords"></div>
    <div class="learnSectionLabel" id="learnEtymLabel"></div>
    <div id="learnEtym"></div>
  </div>
</section>

<main class="kbh-main hidden" id="practiceView">
  <div class="kbh-card">
    <div class="typeLabel" id="typeLabel"></div>
    <div class="promptWrap">
      <div id="promptText"></div>
      <div id="promptSub"></div>
      <div id="promptHint" class="hidden"></div>
      <button type="button" id="speakBtn" class="hidden" title="Ascultă" aria-label="Ascultă">▶</button>
    </div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <button type="button" id="nextBtn"></button>
  </div>
</main>

<main class="kbh-main hidden" id="puzzleView">
  <div class="kbh-card">
    <div class="typeLabel" id="puzzleTypeLabel"></div>
    <div class="promptWrap">
      <div id="puzzleHintChip" class="hintChip"></div>
      <div id="puzzlePrompt"></div>
      <button type="button" id="puzzleSpeak" class="hidden" title="Ascultă" aria-label="Ascultă cuvântul">▶</button>
    </div>
    <div class="answerSlots" id="answerSlots"></div>
    <div class="tileBank" id="tileBank"></div>
    <div class="feedback" id="puzzleFeedback"></div>
    <button type="button" id="puzzleNextBtn"></button>
  </div>
</main>

<footer class="kbh-footer">
  <p id="footerNote">Aplicație independentă · fără cont, fără server · progresul se salvează local, în acest browser</p>
</footer>

<!-- SEARCH OVERLAY -->
<div id="searchOverlay" class="hidden">
  <div id="searchBox">
    <input id="searchInput" type="text" placeholder="Caută hanja, citire, sens…" aria-label="Caută hanja, citire, sens" autocomplete="off" autocorrect="off" spellcheck="false">
    <button type="button" id="searchClear" aria-label="Șterge căutarea">✕</button>
  </div>
  <div id="searchResults"></div>
</div>

<!-- STROKE ORDER PANEL -->
<div id="strokePanel" class="hidden">
  <button type="button" id="strokeClose" aria-label="Închide">✕</button>
  <div id="strokeTitle"></div>
  <div id="strokeWriter"></div>
  <div id="strokeActions">
    <button type="button" id="strokeAnimate">▶ Animație</button>
    <button type="button" id="strokeQuiz">✎ Testează</button>
  </div>
</div>

<!-- STATS PANEL -->
<div id="statsPanel" class="hidden">
  <button type="button" id="statsClose" aria-label="Închide">✕</button>
  <div id="statsTitle"></div>
  <div class="statsGrid" id="statsGrid"></div>
  <div id="statsBackup">
    <button type="button" id="statsExport">⬇ Export</button>
    <button type="button" id="statsImport">⬆ Import</button>
    <input type="file" id="statsImportFile" accept="application/json" class="hidden">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js"></script>
<script src="./data/extra-hanja.js"></script>
<script src="./data/verified-breakdowns.js"></script>
<script src="./app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('./sw.js');
    });
  }
</script>
</body>
</html>
